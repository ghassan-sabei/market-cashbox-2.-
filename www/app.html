<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="app-version" content="6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>صندوق المشتريات</title>
<style>
:root{--bg:#f1f4f3;--card:#fff;--ink:#14201d;--mut:#66756f;--line:#e0e7e4;--pri:#0f766e;--in:#15803d;--out:#b91c1c;--adv:#b45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));font-weight:700;font-size:18px;text-align:center}
main{max-width:640px;margin:0 auto;padding:12px 12px 96px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.lbl{color:var(--mut);font-size:13px;margin-bottom:6px}
.bal{display:flex;gap:10px}
.bal>div{flex:1;background:#f6faf9;border-radius:10px;padding:10px;text-align:center}
.bal span{display:block;font-size:13px;color:var(--mut)}
.bal b{font-size:22px;direction:ltr;display:block;margin-top:2px}
.neg{color:var(--out)}
.btns{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 8px;font-size:16px;font-weight:700;background:#e6ecea;color:var(--ink);font-family:inherit}
.btn.in{background:var(--in);color:#fff}.btn.out{background:var(--out);color:#fff}.btn.adv{background:var(--adv);color:#fff}
.btn.pri{background:var(--pri);color:#fff}.btn.danger{background:#fde8e8;color:var(--out)}
.sm{border:0;background:#e6ecea;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit}
.daybar{display:flex;align-items:center;gap:8px;justify-content:space-between}
input,select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;color:var(--ink)}
.daybar input{width:auto;flex:1;text-align:center}
.tot{width:100%;border-collapse:collapse;font-size:14px}
.tot td,.tot th{padding:5px 4px;text-align:right}
.tot th{color:var(--mut);font-weight:600;font-size:12px;text-align:center}
.tot th:first-child,.tot td:first-child{text-align:right}
.tot td.n{direction:ltr;text-align:center}
.it{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .dot{width:10px;height:10px;border-radius:50%;flex:none}
.it .tx{flex:1;min-width:0}
.it .t{font-weight:600;overflow-wrap:anywhere}
.it .s{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.it .a{font-weight:700;direction:ltr;white-space:nowrap}
.in-c{color:var(--in)}.out-c{color:var(--out)}.adv-c{color:var(--adv)}
.empty{text-align:center;color:var(--mut);padding:22px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:12px;color:var(--mut);font-family:inherit}
nav button i{display:block;font-size:20px;font-style:normal}
nav button.on{color:var(--pri);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--ink);font-size:16px}
.seg input{width:auto;margin:0}
.row{display:flex;gap:8px;margin-top:14px}
.err{color:var(--out);font-size:14px;min-height:20px;margin-top:8px}
#cf{z-index:30;align-items:center;padding:20px}
.dlg{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px}
.dlg p{margin:0 0 6px;line-height:1.6}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1f2d29;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.pills{display:flex;gap:6px;margin-bottom:10px}
.pills button{flex:1;border:0;border-radius:10px;padding:10px 4px;background:#e6ecea;font-size:14px;font-family:inherit}
.pills button.on{background:var(--pri);color:#fff;font-weight:700}
.grid2{display:flex;gap:8px}.grid2>div{flex:1}
.pvbox{position:relative;overflow:hidden;background:#fff;border-radius:8px;border:1px solid var(--line);margin-bottom:12px}
.pv{position:absolute;top:0;right:0}
.warn{background:#fff7e0;border:1px solid #f1d98a;color:#6b4e00;font-size:14px;line-height:1.6}
.wr{display:flex;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line)}
.wr:last-child{border-bottom:0}
.wr .nm{flex:1;font-weight:600}
.wr .sm2{font-size:13px;color:var(--mut)}
.wr .am{direction:ltr;text-align:left;font-weight:700;font-size:14px;line-height:1.5}
h4{margin:2px 0 10px;font-size:17px}
/* full-screen preview */
#vw{position:fixed;inset:0;z-index:25;background:#4b5755;display:flex;flex-direction:column}
#vw.hidden{display:none}
.vwt{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--pri);color:#fff}
.vwt .ttl{flex:1;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vwt button{border:0;border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;background:rgba(255,255,255,.22);color:#fff;font-weight:700}
.vwb{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
.vwb .paper{position:relative;background:#fff;margin:0 auto 12px;width:100%;aspect-ratio:210/297;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.vwb.z .paper{width:230%;margin:0 0 12px}
.vwb .paper img{position:absolute;left:0;top:2.02%;width:100%;display:block}
.vwb .pn{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;color:#888}
/* report (shared by preview, PDF and print) */
.rpt{width:794px;background:#fff;color:#111;padding:36px 40px;font-size:14px;direction:rtl;font-family:Tahoma,Arial,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;line-height:1.45}
.rpt h1{font-size:23px;margin:0 0 4px}
.rpt .sub{color:#555;margin-bottom:16px}
.rpt h2{font-size:16px;margin:14px 0 4px}
.rpt table{width:100%;border-collapse:collapse;margin:6px 0 16px}
.rpt th,.rpt td{border:1px solid #b5b5b5;padding:6px 8px;text-align:right;vertical-align:top}
.rpt th{background:#e6efec}
.rpt td.n{text-align:left;direction:ltr;white-space:nowrap}
.rpt tr.tt td{font-weight:700;background:#f3f3f3}
.rpt .foot{margin-top:18px;color:#777;font-size:11px}
#printArea{display:none}
@media print{
  header,main,nav,.ov,#vw,#toast{display:none!important}
  #printArea{display:block!important}
  .rpt{width:auto;padding:0}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<header id="hd">صندوق المشتريات</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="home"><i>💰</i>الصندوق</button>
  <button data-tab="adv"><i>👷</i>السلف</button>
  <button data-tab="rpt"><i>📄</i>التقارير</button>
  <button data-tab="set"><i>⚙️</i>الإعدادات</button>
</nav>
<div class="ov hidden" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="ov hidden" id="cf"></div>
<div id="toast"></div>
<div id="vw" class="hidden"></div>
<div id="printArea"></div>
<input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
<script src="lib/html2canvas.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- constants & state ---------- */
var KEY='mcb_v1', KEY_BK='mcb_lastbackup', KEY_CUR='mcb_lastcur', KEY_PREV='mcb_prev';
var CUR={IQD:'دينار',USD:'دولار'};
var TYPE={'in':'وارد','out':'صادر','adv':'سلفة'};
var db={seq:0,entries:[],projects:[]};
var ui={tab:'home',day:todayStr(),worker:null,q:'',rpt:{type:'day',day:todayStr(),from:todayStr(),to:todayStr(),worker:'',proj:''},proj:''};
var sheetOpen=false,viewerOpen=false,viewRep=null,zoomed=false;

/* ---------- in-app updates ---------- */
var UPDATE_URL=window.__MCB_UPDATE_URL||'https://raw.githubusercontent.com/ghassan-sabei/market-cashbox-2.-/main/www/app.html';
var KEY_OTA='mcb_ota',KEY_BAD='mcb_badver',KEY_CHK='mcb_lastchk',KEY_BOOT='mcb_boot';
var APP_VERSION=(function(){var m=document.querySelector('meta[name="app-version"]');return m?parseInt(m.content,10)||0:0})();
var checking=false;
function verOf(h){var m=/name="app-version"\s+content="(\d+)"/.exec(h||'');return m?parseInt(m[1],10):0}
function pendingUpdate(){try{var o=JSON.parse(lsGet(KEY_OTA)||'null');return o&&o.v>APP_VERSION?o.v:0}catch(e){return 0}}
async function checkUpdate(manual){
  if(checking)return;
  checking=true;
  try{
    var r=await fetch(UPDATE_URL+(UPDATE_URL.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var html=await r.text();
    lsSet(KEY_CHK,String(Date.now()));
    var okShape=html.length>20000&&html.length<2000000&&html.indexOf('window.__mcb')>0&&html.indexOf('<title>صندوق المشتريات</title>')>0;
    if(!okShape)throw new Error('bad file');
    var v=verOf(html),bad=parseInt(lsGet(KEY_BAD)||'0',10)||0;
    if(v>APP_VERSION&&v>bad&&v>pendingUpdate()){
      lsSet(KEY_OTA,JSON.stringify({v:v,html:html}));
      if(pendingUpdate()===v){
        if(ui.tab==='home'&&!sheetOpen&&!viewerOpen)renderHome();
        if(ui.tab==='set')renderSettings();
        toast('تم تنزيل تحديث جديد');
      }else if(manual)toast('تعذر حفظ التحديث: الذاكرة ممتلئة');
    }else if(manual){toast(pendingUpdate()?'التحديث جاهز، اضغط تحديث الآن':'البرنامج محدّث')}
  }catch(e){if(manual)toast('تعذر التحقق من التحديث، تأكد من الإنترنت')}
  finally{checking=false}
}
function updateBanner(){
  var v=pendingUpdate();
  return v?'<div class="card" style="display:flex;align-items:center;gap:10px;background:#e6f4ea"><div style="flex:1;font-weight:600">يوجد تحديث جديد للبرنامج (إصدار '+v+')</div><button class="sm" id="applyupd" style="background:var(--pri);color:#fff">تحديث الآن</button></div>':'';
}

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtDate(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function addDays(s,n){var p=s.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtNum(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function normDigits(s){return String(s).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/٫/g,'.').replace(/[٬،,\s]/g,'')}
function parseAmt(s){var n=parseFloat(normDigits(s));return isFinite(n)?n:NaN}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
function weekday(s){try{var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('ar',{weekday:'long'})}catch(e){return ''}}
function cmp(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts}

function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&Array.isArray(d.entries)){db=d;if(!Array.isArray(db.projects))db.projects=[];if(!db.seq)db.seq=db.entries.reduce(function(m,e){return Math.max(m,e.id||0)},0)}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('تعذر حفظ البيانات: الذاكرة ممتلئة');return false}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2400)}

/* ---------- calculations ---------- */
function sums(list){var r={IQD:{'in':0,out:0,adv:0},USD:{'in':0,out:0,adv:0}};list.forEach(function(e){r[e.cur][e.type]+=e.amount});return r}
function net(s){return s['in']-s.out-s.adv}
function balance(list){var s=sums(list);return {IQD:net(s.IQD),USD:net(s.USD)}}
function projectNames(){var m={};(db.projects||[]).forEach(function(x){m[x]=1});db.entries.forEach(function(e){if(e.project&&(e.type==='out'||e.type==='adv'))m[e.project]=1});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'ar')})}
function uniq(field,type){var m={};db.entries.forEach(function(e){if((!type||e.type===type)&&e[field])m[e[field]]=1});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'ar')})}

/* ---------- rendering ---------- */
function setTab(t){ui.tab=t;ui.worker=null;render()}
function render(){
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.tab===ui.tab)});
  var titles={home:'صندوق المشتريات',adv:'السلف',rpt:'التقارير',set:'الإعدادات'};
  $('hd').textContent=ui.tab==='adv'&&ui.worker?ui.worker:titles[ui.tab];
  var f={home:renderHome,adv:renderAdv,rpt:renderReports,set:renderSettings}[ui.tab];
  f();
  window.scrollTo(0,0);
}

function balCell(label,v){return '<div><span>'+label+'</span><b class="'+(v<0?'neg':'')+'">'+fmtNum(v)+'</b></div>'}

function backupWarn(){
  if(!db.entries.length)return '';
  var last=lsGet(KEY_BK);
  var days=last?Math.floor((new Date(todayStr())-new Date(last))/86400000):999;
  if(days<7)return '';
  return '<div class="card warn">'+(last?'آخر نسخة احتياطية كانت قبل '+days+' يوم.':'لم تأخذ نسخة احتياطية بعد.')+' البيانات محفوظة على هذا الجوال فقط، فاحفظ نسخة من تبويب «النسخ».</div>';
}

function itemHTML(e,showDate){
  var title,sub='';
  if(e.type==='in'){title='وارد من الإدارة';sub=esc(e.note)}
  else if(e.type==='out'){title=esc(e.seller)+' — '+esc(e.item);var parts=[];if(e.project)parts.push(esc(e.project));if(e.inv)parts.push('فاتورة '+esc(e.inv));if(e.note)parts.push(esc(e.note));sub=parts.join(' · ')}
  else{title='سلفة: '+esc(e.worker);var ps=[];if(e.project)ps.push(esc(e.project));if(e.note)ps.push(esc(e.note));sub=ps.join(' · ')}
  if(showDate)sub=fmtDate(e.date)+(sub?' · '+sub:'');
  var col=e.type==='in'?'in':e.type==='out'?'out':'adv';
  var sign=e.type==='in'?'+':'−';
  return '<div class="it" data-eid="'+e.id+'"><span class="dot" style="background:var(--'+col+')"></span><div class="tx"><div class="t">'+title+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+'</div><div class="a '+col+'-c">'+sign+fmtNum(e.amount)+' '+(e.cur==='IQD'?'د.ع':'$')+'</div></div>';
}

function renderHome(){
  var bal=balance(db.entries);
  var pn=projectNames();if(ui.proj&&pn.indexOf(ui.proj)<0)ui.proj='';
  var list=db.entries.filter(function(e){return e.date===ui.day&&(!ui.proj||(e.type!=='in'&&e.project===ui.proj))}).sort(cmp);
  var ds=sums(list);
  var h=updateBanner()+backupWarn();
  h+='<div class="card"><div class="lbl">رصيد الصندوق الحالي</div><div class="bal">'+balCell('دينار',bal.IQD)+balCell('دولار',bal.USD)+'</div></div>';
  h+='<div class="btns"><button class="btn in" data-add="in">＋ وارد</button><button class="btn out" data-add="out">－ صادر</button><button class="btn adv" data-add="adv">سلفة</button></div>';
  h+='<div class="card daybar"><button class="sm" id="dprev">‹ السابق</button><input type="date" id="dday" value="'+ui.day+'"><button class="sm" id="dnext">التالي ›</button></div>';
  if(pn.length)h+='<div class="card"><label class="lbl">عرض مشروع</label><select id="hproj"><option value="">كل المشاريع</option>'+pn.map(function(x){return '<option value="'+esc(x)+'"'+(x===ui.proj?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div>';
  h+='<div class="card"><div class="lbl">'+weekday(ui.day)+' '+fmtDate(ui.day)+(ui.proj?' — '+esc(ui.proj):'')+'</div>';
  if(list.length){
    h+='<table class="tot"><tr><th></th><th>وارد</th><th>صادر</th><th>سلف</th></tr>';
    ['IQD','USD'].forEach(function(c){var s=ds[c];if(s['in']||s.out||s.adv)h+='<tr><td>'+CUR[c]+'</td><td class="n in-c">'+fmtNum(s['in'])+'</td><td class="n out-c">'+fmtNum(s.out)+'</td><td class="n adv-c">'+fmtNum(s.adv)+'</td></tr>'});
    h+='</table><div style="height:6px"></div>';
    h+=list.map(function(e){return itemHTML(e,false)}).join('');
  }else h+='<div class="empty">لا توجد حركات في هذا اليوم</div>';
  h+='</div>';
  $('app').innerHTML=h;
}

function workersMap(){
  var m={};
  db.entries.forEach(function(e){if(e.type!=='adv')return;var w=m[e.worker]||(m[e.worker]={name:e.worker,n:0,IQD:0,USD:0});w.n++;w[e.cur]+=e.amount});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.name.localeCompare(b.name,'ar')});
}
function amtLines(o){var a=[];if(o.IQD)a.push(fmtNum(o.IQD)+' د.ع');if(o.USD)a.push(fmtNum(o.USD)+' $');return a.join('<br>')||'0'}

function renderAdv(){
  if(ui.worker)return renderWorker();
  var h='<div class="btns"><button class="btn adv" data-add="adv">＋ سلفة جديدة</button></div>';
  h+='<div class="card"><input id="wq" placeholder="ابحث باسم العامل" value="'+esc(ui.q)+'"><div id="wl" style="margin-top:8px"></div></div>';
  $('app').innerHTML=h;
  fillWorkers();
}
function fillWorkers(){
  var q=clean(ui.q);
  var list=workersMap().filter(function(w){return !q||w.name.indexOf(q)>=0});
  var tot={IQD:0,USD:0};list.forEach(function(w){tot.IQD+=w.IQD;tot.USD+=w.USD});
  var h='';
  if(!list.length)h='<div class="empty">'+(q?'لا يوجد عامل بهذا الاسم':'لم تسجل أي سلفة بعد')+'</div>';
  else{
    h=list.map(function(w){return '<div class="wr" data-w="'+esc(w.name)+'"><div class="nm">'+esc(w.name)+'<div class="sm2">'+w.n+' سلفة</div></div><div class="am adv-c">'+amtLines(w)+'</div></div>'}).join('');
    h+='<div class="wr" style="border-top:2px solid var(--line)"><div class="nm">المجموع</div><div class="am">'+amtLines(tot)+'</div></div>';
  }
  $('wl').innerHTML=h;
}
function workerEntries(name){return db.entries.filter(function(e){return e.type==='adv'&&e.worker===name}).sort(cmp)}
function renderWorker(){
  var list=workerEntries(ui.worker);
  var s=sums(list);
  var h='<div class="btns"><button class="btn" id="wback">‹ رجوع</button><button class="btn adv" data-add="adv" data-worker="'+esc(ui.worker)+'">＋ سلفة</button></div>';
  h+='<div class="card"><div class="lbl">إجمالي السلف</div><div class="bal">'+balCell('دينار',s.IQD.adv)+balCell('دولار',s.USD.adv)+'</div></div>';

  return buildReport('worker',{worker:r.worker});
}

function saveForm(type,entry){
  var err=function(m){$('f_err').textContent=m};
  var date=$('f_date').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return err('اختر التاريخ');
  var amt=parseAmt($('f_amt').value);
  if(!(amt>0))return err('اكتب مبلغاً صحيحاً');
  amt=Math.round(amt*100)/100;
  var cur=document.querySelector('input[name=cur]:checked').value;
  var rec={type:type,date:date,cur:cur,amount:amt,seller:'',item:'',inv:'',project:'',worker:'',note:clean($('f_note').value)};
  if(type==='out'){
    rec.project=clean($('f_project').value||'');rec.seller=clean($('f_seller').value);rec.item=clean($('f_item').value);rec.inv=clean($('f_inv').value);
    if(!rec.project)return err('اختر المشروع (أضفه من الإعدادات)');
    if(!rec.seller)return err('اكتب اسم البائع');
    if(!rec.item)return err('اكتب المادة');
  }
  if(type==='adv'){
    rec.worker=clean($('f_worker').value);rec.project=clean($('f_project').value||'');
    if(!rec.worker)return err('اكتب اسم العامل');
    if(!rec.project)return err('اختر المشروع (أضفه من الإعدادات)');
  }
  if(entry){var i=db.entries.findIndex(function(x){return x.id===entry.id});rec.id=entry.id;rec.ts=entry.ts;db.entries[i]=rec}
  else{rec.id=++db.seq;rec.ts=Date.now();db.entries.push(rec)}
  if(!save())return;
  lsSet(KEY_CUR,cur);
  if(rec.project)lsSet('mcb_proj',rec.project);
  ui.day=date;
  closeSheet();
  render();
  toast('تم الحفظ');
}

function entryDetails(e){

function amtCells(e){return '<td class="n">'+(e.cur==='IQD'?fmtNum(e.amount):'')+'</td><td class="n">'+(e.cur==='USD'?fmtNum(e.amount):'')+'</td>'}
function summaryTable(from,to){
  var before=balance(db.entries.filter(function(e){return e.date<from}));
  var inr=sums(db.entries.filter(function(e){return e.date>=from&&e.date<=to}));
  var h='<table><thead><tr><th>العملة</th><th>الرصيد السابق</th><th>وارد</th><th>صادر</th><th>سلف</th><th>الرصيد الحالي</th></tr></thead><tbody>';
  ['IQD','USD'].forEach(function(c){
    var s=inr[c];var close=before[c]+s['in']-s.out-s.adv;
    h+='<tr><td>'+CUR[c]+'</td><td class="n">'+fmtNum(before[c])+'</td><td class="n">'+fmtNum(s['in'])+'</td><td class="n">'+fmtNum(s.out)+'</td><td class="n">'+fmtNum(s.adv)+'</td><td class="n"><b>'+fmtNum(close)+'</b></td></tr>';
  });
  return h+'</tbody></table>';
}
function entriesTable(list,withDate){
  if(!list.length)return '<p>لا توجد حركات.</p>';
  var h='<table><thead><tr><th>#</th>'+(withDate?'<th>التاريخ</th>':'')+'<th>النوع</th><th>التفاصيل</th><th>المشروع</th><th>رقم الفاتورة</th><th>دينار</th><th>دولار</th></tr></thead><tbody>';
  list.forEach(function(e,i){h+='<tr><td>'+(i+1)+'</td>'+(withDate?'<td class="n">'+fmtDate(e.date)+'</td>':'')+'<td>'+TYPE[e.type]+'</td><td>'+entryDetails(e)+'</td><td>'+esc(e.project)+'</td><td>'+esc(e.inv)+'</td>'+amtCells(e)+'</tr>'});
  return h+'</tbody></table>';
}
function projectTable(list){
  var m={},names=[];
  list.forEach(function(e){
    if(e.type!=='out'&&e.type!=='adv')return;
    var k=e.project||'بدون مشروع';
    if(!m[k]){m[k]={oI:0,oU:0,aI:0,aU:0,n:0};names.push(k)}
    var r=m[k];
    if(e.type==='out'){if(e.cur==='IQD')r.oI+=e.amount;else r.oU+=e.amount;r.n++}
    else{if(e.cur==='IQD')r.aI+=e.amount;else r.aU+=e.amount}
  });
  if(!names.length)return '';
  names.sort(function(a,b){return a.localeCompare(b,'ar')});
  var t={oI:0,oU:0,aI:0,aU:0,n:0};
  var h='<h2>المصروفات حسب المشروع</h2><table><thead><tr><th>المشروع</th><th>عدد الفواتير</th><th>صادر دينار</th><th>صادر دولار</th><th>سلف دينار</th><th>سلف دولار</th></tr></thead><tbody>';
  names.forEach(function(k){var r=m[k];['oI','oU','aI','aU','n'].forEach(function(f){t[f]+=r[f]});h+='<tr><td>'+esc(k)+'</td><td class="n">'+r.n+'</td><td class="n">'+fmtNum(r.oI)+'</td><td class="n">'+fmtNum(r.oU)+'</td><td class="n">'+fmtNum(r.aI)+'</td><td class="n">'+fmtNum(r.aU)+'</td></tr>'});
  if(names.length>1)h+='<tr class="tt"><td>المجموع</td><td class="n">'+t.n+'</td><td class="n">'+fmtNum(t.oI)+'</td><td class="n">'+fmtNum(t.oU)+'</td><td class="n">'+fmtNum(t.aI)+'</td><td class="n">'+fmtNum(t.aU)+'</td></tr>';
  return h+'</tbody></table>';
}
function buildReport(kind,p){
  var h='<div class="rpt">',name,file,title;
  var stamp='صدر بتاريخ '+fmtDate(todayStr());
  if(kind==='proj'){
    var all=p.project==='__all';
    var pl=db.entries.filter(function(e){return (all||e.project===p.project)&&e.type!=='in'&&e.date>=p.from&&e.date<=p.to}).sort(cmp);
    var ps=sums(pl);
    if(all){
      title='تقرير كل المشاريع';file='projects-'+p.from+'_'+p.to+'.pdf';
      h+='<h1>تقرير كل المشاريع</h1><div class="sub">من '+fmtDate(p.from)+' إلى '+fmtDate(p.to)+'</div>';
      if(!pl.length)h+='<p>لا توجد حركات في هذه الفترة.</p>';
      else{
        h+=projectTable(pl);
        var groups={},gn=[];
        pl.forEach(function(e){var k=e.project||'بدون مشروع';if(!groups[k]){groups[k]=[];gn.push(k)}groups[k].push(e)});
        gn.sort(function(a,b){return a.localeCompare(b,'ar')});
        gn.forEach(function(k){
          var gs=sums(groups[k]);
          h+='<h2>'+esc(k)+'</h2>'+entriesTable(groups[k],true);
          h+='<table><tbody><tr class="tt"><td>إجمالي '+esc(k)+' (صادر + سلف)</td><td class="n">دينار: '+fmtNum(gs.IQD.out+gs.IQD.adv)+'</td><td class="n">دولار: '+fmtNum(gs.USD.out+gs.USD.adv)+'</td></tr></tbody></table>';
        });
      }
    }else{
    title='تقرير مشروع: '+p.project;file='project-'+p.from+'_'+p.to+'.pdf';
    h+='<h1>تقرير مشروع</h1><div class="sub">'+esc(p.project)+' — من '+fmtDate(p.from)+' إلى '+fmtDate(p.to)+'</div>';
    if(!pl.length)h+='<p>لا توجد حركات لهذا المشروع في هذه الفترة.</p>';
    else{
      h+='<table><thead><tr><th>العملة</th><th>الصادر (الفواتير)</th><th>السلف</th><th>الإجمالي</th></tr></thead><tbody>';
      ['IQD','USD'].forEach(function(c){var q=ps[c];h+='<tr><td>'+CUR[c]+'</td><td class="n">'+fmtNum(q.out)+'</td><td class="n">'+fmtNum(q.adv)+'</td><td class="n"><b>'+fmtNum(q.out+q.adv)+'</b></td></tr>'});
      h+='</tbody></table><h2>الحركات</h2>'+entriesTable(pl,true);
    }
    }
  }else if(kind==='worker'){
    var list=workerEntries(p.worker);var s=sums(list);
    title='كشف سلف: '+p.worker;file='advances-'+todayStr()+'.pdf';
    h+='<h1>كشف سلف عامل</h1><div class="sub">'+esc(p.worker)+'</div>';
    if(!list.length)h+='<p>لا توجد سلف.</p>';
    else{
      h+='<table><thead><tr><th>#</th><th>التاريخ</th><th>ملاحظة</th><th>دينار</th><th>دولار</th></tr></thead><tbody>';
      list.forEach(function(e,i){h+='<tr><td>'+(i+1)+'</td><td class="n">'+fmtDate(e.date)+'</td><td>'+esc(e.note)+'</td>'+amtCells(e)+'</tr>'});
      h+='<tr class="tt"><td colspan="3">إجمالي السلف</td><td class="n">'+fmtNum(s.IQD.adv)+'</td><td class="n">'+fmtNum(s.USD.adv)+'</td></tr></tbody></table>';
    }
  }else{
    var from=p.from,to=p.to;
    var list2=db.entries.filter(function(e){return e.date>=from&&e.date<=to}).sort(cmp);
    if(kind==='day'){
      title='تقرير يومي '+fmtDate(from);file='daily-'+from+'.pdf';
      h+='<h1>تقرير الصندوق اليومي</h1><div class="sub">'+weekday(from)+' '+fmtDate(from)+'</div>';
    }else{
      title='تقرير الصندوق من '+fmtDate(from)+' إلى '+fmtDate(to);file='period-'+from+'_'+to+'.pdf';
      h+='<h1>تقرير الصندوق</h1><div class="sub">من '+fmtDate(from)+' إلى '+fmtDate(to)+'</div>';
    }
    h+='<h2>الملخص</h2>'+summaryTable(from,to)+projectTable(list2)+'<h2>الحركات</h2>'+entriesTable(list2,kind!=='day');
  }
  h+='<div class="foot">'+stamp+' — صندوق المشتريات</div></div>';
  return {html:h,filename:file,title:title};
}

var rcache={html:null,pages:null};
async function renderPages(html){
  if(rcache.html===html&&rcache.pages)return rcache.pages;
  var host=document.createElement('div');
  host.style.cssText='position:absolute;left:0;top:0;width:794px;z-index:-1;background:#fff';
  host.innerHTML=html;document.body.appendChild(host);
  var el=host.firstElementChild;
  try{
    var top=el.getBoundingClientRect().top;
    var totalH=Math.ceil(el.getBoundingClientRect().height);
    var cuts=Array.prototype.map.call(el.querySelectorAll('tbody tr'),function(r){return Math.ceil(r.getBoundingClientRect().bottom-top)});
    var W=210,H=297,M=6,pxmm=794/W,pageH=Math.floor((H-2*M-6)*pxmm);
    var ranges=[],start=0;
    while(start<totalH-1){
      var limit=start+pageH,cut=limit;
      if(limit>=totalH)cut=totalH;
      else{var best=-1;cuts.forEach(function(b){if(b>start+60&&b<=limit&&b>best)best=b});if(best>0)cut=best}
      ranges.push([start,cut]);start=cut;
    }
    var out=[];
    for(var i=0;i<ranges.length;i++){
      var s0=ranges[i][0],c=ranges[i][1];
      var canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false,x:0,y:s0,width:794,height:c-s0,windowWidth:794,scrollX:0,scrollY:0});
      out.push({url:canvas.toDataURL('image/jpeg',0.85),h:(c-s0)/pxmm});
      canvas.width=1;canvas.height=1;
    }
    rcache={html:html,pages:out};
    return out;
  }finally{host.remove()}
}
function pdfFromPages(pages){
  var jsPDF=window.jspdf.jsPDF;
  var pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  var W=210,H=297,M=6;
  pages.forEach(function(p,i){
    if(i>0)pdf.addPage();
    pdf.addImage(p.url,'JPEG',0,M,W,p.h);
    pdf.setFontSize(8);pdf.setTextColor(120);
    pdf.text((i+1)+' / '+pages.length,W/2,H-4,{align:'center'});
  });
  return pdf.output('blob');
}
async function makePDF(html){return pdfFromPages(await renderPages(html))}

/* ---------- sharing / files ---------- */
function isNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}
function plug(n){var C=window.Capacitor;return (C.Plugins&&C.Plugins[n])||C.registerPlugin(n)}
function blobToBase64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(blob)})}
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
async function shareFile(blob,name,title){
  try{
    if(isNative()){
      var FS=plug('Filesystem'),SH=plug('Share');
      var w=await FS.writeFile({path:name,data:await blobToBase64(blob),directory:'CACHE'});
      await SH.share({title:title,dialogTitle:title,files:[w.uri]});
      return true;
    }
    var file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:title});return true}
    download(blob,name);return true;
  }catch(e){
    var m=String(e&&e.message||e);
    if(e&&(e.name==='AbortError'||/cancel/i.test(m)))return false;
    toast('تعذر الإرسال: '+m);return false;
  }
}
async function openPreview(rep){
  toast('جارٍ تجهيز المعاينة...');
  try{
    var pages=await renderPages(rep.html);
    viewRep=rep;zoomed=false;
    var h='<div class="vwt"><button id="vclose">✕ إغلاق</button><div class="ttl">'+esc(rep.title)+'</div><button id="vzoom">🔍</button><button id="vprint">طباعة</button><button id="vpdf">PDF</button></div><div class="vwb" id="vwb">';
    pages.forEach(function(p,i){h+='<div class="paper"><img src="'+p.url+'" alt=""><div class="pn">'+(i+1)+' / '+pages.length+'</div></div>'});
    h+='</div>';
    $('vw').innerHTML=h;
    $('vw').classList.remove('hidden');
    $('toast').classList.remove('on');
    if(!viewerOpen){viewerOpen=true;history.pushState({v:1},'')}
  }catch(e){toast('تعذر تجهيز المعاينة: '+(e&&e.message||e))}
}
function hideViewer(){viewerOpen=false;viewRep=null;$('vw').classList.add('hidden');$('vw').innerHTML=''}
function closeViewer(){if(viewerOpen)history.back()}
async function printAny(rep){
  if(!isNative()){printReport(rep);return}
  toast('جارٍ تجهيز الملف للطباعة...');
  try{
    var blob=await makePDF(rep.html);
    var w=await plug('Filesystem').writeFile({path:rep.filename,data:await blobToBase64(blob),directory:'CACHE'});
    await plug('PrintPDF').print({uri:w.uri,name:rep.title});
  }catch(e){toast('تعذر الطباعة: '+(e&&e.message||e))}
}
async function sharePDF(rep){
  toast('جارٍ تجهيز الملف...');
  try{
    var blob=await makePDF(rep.html);
    await shareFile(blob,rep.filename,rep.title);
  }catch(e){toast('تعذر إنشاء PDF: '+(e&&e.message||e))}
}
function printReport(rep){
  $('printArea').innerHTML=rep.html;
  window.onafterprint=function(){$('printArea').innerHTML='';window.onafterprint=null};
  window.print();
}

async function doBackup(){
  var payload=JSON.stringify({app:'market-cashbox',version:1,exported:new Date().toISOString(),seq:db.seq,projects:db.projects||[],entries:db.entries});
  var blob=new Blob([payload],{type:'application/json'});
  var ok=await shareFile(blob,'market-cashbox-backup-'+todayStr()+'.json','نسخة احتياطية - صندوق المشتريات');
  if(ok){lsSet(KEY_BK,todayStr());if(ui.tab==='set')renderSettings();toast('تم حفظ النسخة')}
}
function validEntry(e){
  return e&&['in','out','adv'].indexOf(e.type)>=0&&(e.cur==='IQD'||e.cur==='USD')&&typeof e.amount==='number'&&e.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(e.date||'');
}
function doRestore(file){
  var r=new FileReader();
  r.onload=function(){
    var d;try{d=JSON.parse(r.result)}catch(e){return toast('الملف غير صالح')}
    if(!d||d.app!=='market-cashbox'||!Array.isArray(d.entries))return toast('هذا ليس ملف نسخة احتياطية للبرنامج');
    var good=d.entries.filter(validEntry);
    if(!good.length&&d.entries.length)return toast('الملف لا يحتوي بيانات صالحة');
    confirmBox('سيتم استبدال البيانات الحالية ('+db.entries.length+' حركة) بـ '+good.length+' حركة من الملف. متابعة؟','استرجاع',true).then(function(ok){
      if(!ok)return;
      lsSet(KEY_PREV,JSON.stringify(db));
      var seq=0;
      db={seq:0,projects:Array.isArray(d.projects)?d.projects.filter(function(x){return typeof x==='string'&&x}):[],entries:good.map(function(e){
        seq=Math.max(seq,e.id||0);
        return {id:e.id||0,type:e.type,date:e.date,cur:e.cur,amount:e.amount,seller:e.seller||'',item:e.item||'',inv:e.inv||'',project:e.project||'',worker:e.worker||'',note:e.note||'',ts:e.ts||0};
      })};
      db.entries.forEach(function(e){if(!e.id)e.id=++seq});
      db.seq=seq;
      save();render();toast('تم الاسترجاع');
    });
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target;
  var el=t.closest?t.closest('[data-tab],[data-add],[data-eid],[data-w],[data-rt],#dprev,#dnext,#wback,#wview,#wpdf,#wprint,#rview,#rpdf,#rprint,#vclose,#vzoom,#vprint,#vpdf,#applyupd,#chkupd,#bk,#padd,[data-pdel],#rs,#wipe'):null;
  if(!el)return;
  if(el.dataset.tab){setTab(el.dataset.tab);return}
  if(el.id==='padd'){
    var nm=clean($('p_new').value);if(!nm)return toast('اكتب اسم المشروع');
    if(projectNames().indexOf(nm)>=0)return toast('هذا المشروع موجود');
    db.projects.push(nm);if(save()){renderSettings();toast('تمت الإضافة')}return}
  if(el.dataset.pdel!==undefined){
    var pd=el.dataset.pdel;
    if(db.entries.some(function(x){return x.project===pd}))return toast('المشروع مستخدم في حركات مسجلة ولا يمكن حذفه');
    db.projects=db.projects.filter(function(x){return x!==pd});if(save())renderSettings();return}
  if(el.dataset.add){openForm(el.dataset.add,null,el.dataset.worker);return}
  if(el.dataset.eid){var e=db.entries.find(function(x){return x.id===Number(el.dataset.eid)});if(e)openForm(e.type,e);return}
  if(el.dataset.w){openWorker(el.dataset.w);return}
  if(el.dataset.rt){ui.rpt.type=el.dataset.rt;renderReports();return}
  switch(el.id){
    case 'dprev':ui.day=addDays(ui.day,-1);renderHome();break;
    case 'dnext':ui.day=addDays(ui.day,1);renderHome();break;
    case 'wback':backWorker();break;
    case 'wpdf':sharePDF(buildReport('worker',{worker:ui.worker}));break;
    case 'wview':openPreview(buildReport('worker',{worker:ui.worker}));break;
    case 'wprint':printAny(buildReport('worker',{worker:ui.worker}));break;
    case 'rview':openPreview(currentReport());break;
    case 'rpdf':sharePDF(currentReport());break;
    case 'rprint':printAny(currentReport());break;
    case 'vclose':closeViewer();break;
    case 'vzoom':zoomed=!zoomed;$('vwb').classList.toggle('z',zoomed);break;
    case 'vprint':if(viewRep)printAny(viewRep);break;
    case 'vpdf':if(viewRep)sharePDF(viewRep);break;
    case 'applyupd':location.reload();break;
    case 'chkupd':checkUpdate(true);break;
    case 'bk':doBackup();break;
    case 'rs':$('restoreFile').click();break;
    case 'wipe':
      confirmBox('سيتم حذف كل الحركات نهائياً من هذا الجوال. هل أخذت نسخة احتياطية؟','متابعة',true).then(function(ok){
        if(!ok)return;
        return confirmBox('تأكيد أخير: حذف كل البيانات؟','نعم، احذف',true).then(function(ok2){
          if(!ok2)return;
          lsSet(KEY_PREV,JSON.stringify(db));db={seq:0,entries:[],projects:db.projects||[]};save();render();toast('تم الحذف');
        });
      });break;
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='wq'){ui.q=t.value;fillWorkers()}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='dday'&&t.value){ui.day=t.value;renderHome()}
  else if(t.id==='r_day'&&t.value){ui.rpt.day=t.value;showPreview()}
  else if(t.id==='r_from'&&t.value){ui.rpt.from=t.value;showPreview()}
  else if(t.id==='r_to'&&t.value){ui.rpt.to=t.value;showPreview()}
  else if(t.id==='r_w'){ui.rpt.worker=t.value;showPreview()}
  else if(t.id==='r_p'){ui.rpt.proj=t.value;showPreview()}
  else if(t.id==='hproj'){ui.proj=t.value;renderHome()}
  else if(t.id==='restoreFile'){if(t.files&&t.files[0])doRestore(t.files[0]);t.value=''}
});
$('ov').addEventListener('click',function(ev){if(ev.target===$('ov'))closeSheet()});

if('serviceWorker' in navigator&&!isNative()&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}

load();
render();
lsSet(KEY_BOOT,'ok');
if(isNative()){
  setTimeout(function(){checkUpdate(false)},3000);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    var last=parseInt(lsGet(KEY_CHK)||'0',10)||0;
    if(Date.now()-last>3600000)checkUpdate(false);
  });
}
window.__mcb={db:function(){return db},ui:ui,buildReport:buildReport,makePDF:makePDF,fmtNum:fmtNum,parseAmt:parseAmt,sums:sums};
})();
</script>
