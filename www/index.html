<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>صندوق المشتريات</title>
<style>html,body{margin:0;background:#f1f4f3;font-family:system-ui,Tahoma,Arial,sans-serif;color:#66756f}body{display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head>
<body>جارٍ التحميل...
<script>
/* Tiny loader. It starts the newest copy of the app: either the one bundled in the APK,
   or a newer one the app downloaded earlier (in-app update). If a downloaded copy fails to
   start, it is dropped on the next launch and the bundled copy is used instead. */
(function(){
  function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function d(k){try{localStorage.removeItem(k)}catch(e){}}
  function ver(h){var m=/name="app-version"\s+content="(\d+)"/.exec(h||'');return m?parseInt(m[1],10):0}
  function run(html,tag){s('mcb_boot',tag);document.open();document.write(html);document.close()}
  var ota=null;
  try{ota=JSON.parse(g('mcb_ota')||'null')}catch(e){}
  if(g('mcb_boot')==='pending-ota'&&ota){s('mcb_badver',String(ota.v));d('mcb_ota');ota=null}
  var bad=parseInt(g('mcb_badver')||'0',10)||0;
  fetch('app.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(bundled){
    if(ota&&ota.html&&ver(ota.html)>ver(bundled)&&ver(ota.html)>bad)run(ota.html,'pending-ota');
    else{if(ota)d('mcb_ota');run(bundled,'pending-bundled')}
  }).catch(function(){
    if(ota&&ota.html)run(ota.html,'pending-ota');
    else document.body.textContent='تعذر تحميل البرنامج';
  });
})();
</script>
</body>
</html>
