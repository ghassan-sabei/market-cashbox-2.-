name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk market-cashbox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: market-cashbox-apk
          path: market-cashbox.apk

      - name: Publish as a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: market-cashbox.apk

      - name: Save the build log to a branch
        if: always()
        run: |
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/keep.log" 2>/dev/null || echo "no build log" > "$RUNNER_TEMP/keep.log"
          echo "job status: ${{ job.status }}" >> "$RUNNER_TEMP/keep.log"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . -q
          cp "$RUNNER_TEMP/keep.log" build.log
          git add build.log
          git commit -q -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-log
